spring.application.name=service-a
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.rsocket.server.transport=tcp
spring.rsocket.server.address=${APP_BIND_ADDRESS:127.0.0.1}
spring.rsocket.server.port=${APP_RSOCKET_PORT:7000}
spring.config.import=optional:nacos:${spring.application.name}.properties?group=${NACOS_GROUP:LAMBDA_EXAMPLE}&refreshEnabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:${SERVICE_HOST:127.0.0.1}:8848}
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:${SERVICE_HOST:127.0.0.1}:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:LAMBDA_EXAMPLE}
spring.cloud.nacos.discovery.ip=${APP_REGISTER_IP:127.0.0.1}
spring.cloud.nacos.username=${NACOS_USERNAME:${SERVICE_USER:root}}
spring.cloud.nacos.password=${NACOS_PASSWORD:${SERVICE_PASSWORD}}
lambda.repository.mongo.uri=${MONGODB_URI}
lambda.repository.mongo.mode=${MONGODB_MODE:single}
lambda.repository.redis.nodes=${REDIS_NODES:${SERVICE_HOST:127.0.0.1}:6379}
lambda.repository.redis.mode=${REDIS_MODE:single}
lambda.repository.redis.username=${REDIS_USERNAME:${SERVICE_USER:root}}
lambda.repository.redis.password=${REDIS_PASSWORD:${SERVICE_PASSWORD:}}
lambda.repository.qdrant.endpoints=${QDRANT_ENDPOINTS:grpc://${SERVICE_HOST:127.0.0.1}:6334}
lambda.repository.qdrant.mode=${QDRANT_MODE:single}
lambda.repository.qdrant.api-key=${QDRANT_API_KEY:${SERVICE_PASSWORD:}}
lambda.mq.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${SERVICE_HOST:127.0.0.1}:5672}
lambda.mq.rabbitmq.mode=${RABBITMQ_MODE:single}
lambda.mq.rabbitmq.username=${RABBITMQ_USERNAME:${SERVICE_USER:root}}
lambda.mq.rabbitmq.password=${RABBITMQ_PASSWORD:${SERVICE_PASSWORD:}}
example.resource-prefix=${EXAMPLE_RESOURCE_PREFIX:lambda_example}
example.vector.replication-factor=${EXAMPLE_VECTOR_REPLICATION_FACTOR:1}
example.demo-user=${EXAMPLE_DEMO_USER:demo}
example.demo-password=${EXAMPLE_DEMO_PASSWORD}
example.greeting=local-default
