spring.application.name=service-a
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.rsocket.server.transport=tcp
spring.rsocket.server.address=127.0.0.1
spring.rsocket.server.port=7000
spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}
spring.cloud.nacos.discovery.group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.discovery.ip=127.0.0.1
lambda.repository.mongo.uri=mongodb://root:replace-me@127.0.0.1:27017/lambda_example?authSource=admin&replicaSet=rs0
lambda.repository.mongo.mode=single
lambda.repository.redis.nodes=127.0.0.1:6379
lambda.repository.redis.mode=single
lambda.repository.redis.username=root
lambda.repository.redis.password=replace-me
lambda.repository.qdrant.endpoints=grpc://127.0.0.1:6334
lambda.repository.qdrant.mode=single
lambda.repository.qdrant.api-key=replace-me
lambda.mq.rabbitmq.addresses=127.0.0.1:5672
lambda.mq.rabbitmq.mode=single
lambda.mq.rabbitmq.username=root
lambda.mq.rabbitmq.password=replace-me
example.resource-prefix=lambda_example
example.vector.replication-factor=1
example.demo-user=demo
example.demo-password=replace-me
example.greeting=nacos-configured

# Optional components. Omit the endpoint and business topic when unused.
# lambda.mq.kafka.bootstrap-servers=127.0.0.1:9092
# lambda.mq.kafka.mode=single
# example.kafka.topic=lambda_catalog_events
# example.kafka.group=lambda_catalog
# lambda.lock.zookeeper.connect-string=127.0.0.1:2181
# lambda.lock.zookeeper.mode=single
# example.partner.base-url=https://partner.example.com
lambda.guid.mode=single

