spring.application.name=gateway
spring.main.web-application-type=reactive
server.address=127.0.0.1
server.port=8081
spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}
spring.cloud.nacos.discovery.group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.discovery.register-enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=example
spring.cloud.gateway.server.webflux.routes[0].uri=rb://service-a
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webflux.routes[1].id=chat-websocket
spring.cloud.gateway.server.webflux.routes[1].uri=ws://service-b
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ws/api/chat/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
lambda.repository.redis.nodes=127.0.0.1:6379
lambda.repository.redis.mode=single
lambda.repository.redis.username=root
lambda.repository.redis.password=replace-me
lambda.security.permit-paths=/api/session/login

# Match Service A's Redis topology for session validation.
# lambda.repository.redis.mode=cluster
# lambda.repository.redis.nodes=redis-1:6379,redis-2:6379,redis-3:6379
