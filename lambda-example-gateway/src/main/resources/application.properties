spring.application.name=${GATEWAY_NAME:lambda-example-gateway}
spring.main.web-application-type=reactive
server.address=${GATEWAY_BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8081}
spring.config.import=optional:nacos:${spring.application.name}.properties?group=${NACOS_GROUP:LAMBDA_EXAMPLE}&refreshEnabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:${SERVICE_HOST:127.0.0.1}:8848}
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:${SERVICE_HOST:127.0.0.1}:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:LAMBDA_EXAMPLE}
spring.cloud.nacos.discovery.register-enabled=false
spring.cloud.nacos.username=${NACOS_USERNAME:${SERVICE_USER:root}}
spring.cloud.nacos.password=${NACOS_PASSWORD:${SERVICE_PASSWORD}}
spring.cloud.gateway.server.webflux.routes[0].id=example
spring.cloud.gateway.server.webflux.routes[0].uri=rb://${APP_NAME:lambda-example-app}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**
