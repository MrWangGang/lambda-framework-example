spring.application.name=${APP_NAME:lambda-example-app}
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8081}
spring.config.import=nacos:${spring.application.name}.properties?group=${NACOS_GROUP:LAMBDA_EXAMPLE}&refreshEnabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:${SERVICE_HOST:127.0.0.1}:8848}
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:${SERVICE_HOST:127.0.0.1}:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:LAMBDA_EXAMPLE}
spring.cloud.nacos.discovery.ip=${APP_REGISTER_IP:127.0.0.1}
spring.cloud.nacos.username=${NACOS_USERNAME:${SERVICE_USER:root}}
spring.cloud.nacos.password=${NACOS_PASSWORD:${SERVICE_PASSWORD}}
lambda.repository.mongo.host=${SERVICE_HOST:127.0.0.1}:27017
lambda.repository.mongo.user=${SERVICE_USER:root}
lambda.repository.mongo.password=${SERVICE_PASSWORD}
lambda.repository.mongo.auth-database=admin
lambda.repository.mongo.database=${MONGO_DATABASE:lambda_example}
lambda.repository.mongo.deploy=cluster
lambda.repository.mongo.replica=${MONGODB_REPLICA_SET:rs0}
lambda.repository.redis.host=${SERVICE_HOST:127.0.0.1}:6379
lambda.repository.redis.username=${SERVICE_USER:root}
lambda.repository.redis.password=${SERVICE_PASSWORD}
lambda.repository.redis.database=0
lambda.repository.redis.deploy=single
lambda.mq.rabbitmq.host=${SERVICE_HOST:127.0.0.1}:5672
lambda.mq.rabbitmq.user=${SERVICE_USER:root}
lambda.mq.rabbitmq.password=${SERVICE_PASSWORD}
example.resource-prefix=${EXAMPLE_RESOURCE_PREFIX:lambda_example}
example.qdrant.url=http://${SERVICE_HOST:127.0.0.1}:6333
example.qdrant.api-key=${QDRANT_API_KEY:${SERVICE_PASSWORD}}
example.greeting=local-default
